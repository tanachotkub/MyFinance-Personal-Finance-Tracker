name: myfinance
description: Personal Finance Tracker
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  google_fonts: ^6.2.1
  path_provider: ^2.1.4
  flutter:
    sdk: flutter

  # Database
  sqflite: ^2.3.2
  path: ^1.9.0

  # State Management
  provider: ^6.1.2

  # Charts
  fl_chart: ^0.68.0

  # Calendar
  table_calendar: ^3.1.2

  # Format วันที่ / ตัวเลข
  intl: ^0.19.0

  # จำ settings
  shared_preferences: ^2.2.3

  # Export CSV
  csv: ^6.0.0

  # แชร์ไฟล์
  share_plus: ^9.0.0

  # UUID
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true